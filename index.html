<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHẤM CÔNG AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --blue-900:#0d2b6b; --blue-700:#1d4ed8; --blue-600:#2563eb; --blue-500:#3b82f6; --blue-50:#eaf1ff;
  --green:#16a34a; --green-d:#0e7a37;
  --red:#dc2626; --red-d:#b91c1c;
  --orange:#ea7c17; --orange-d:#c2650f;
  --purple:#7c3aed; --purple-d:#5f27c9;
  --ink:#152447; --sub:#5b6b8c; --line:#e3e8f5; --bg:#f2f5fc; --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:28px;}
.topbar{
  background:linear-gradient(135deg,var(--blue-900),var(--blue-600));
  color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(13,43,107,.25);
}
.topbar .title{font-weight:800;letter-spacing:.4px;font-size:16px;flex:1;text-align:center;}
.topbar button.iconbtn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;}
.topbar button.iconbtn:active{background:rgba(255,255,255,.3);}
.content{padding:16px;}

.hero{
  background:linear-gradient(160deg,#dfe9ff,#c9dbff);
  border-radius:18px;padding:26px 18px;text-align:center;margin-bottom:16px;
  border:1px solid #cfe0ff;
}
.hero .brand{font-size:30px;font-weight:900;color:var(--blue-700);letter-spacing:.5px;}
.hero .app-name{font-size:19px;font-weight:800;color:var(--blue-900);margin-top:10px;}
.hero .tag{font-size:13px;color:var(--sub);margin-top:4px;}
.hero .badge{display:inline-block;margin-top:12px;background:var(--blue-600);color:#fff;font-size:12px;font-weight:700;padding:7px 16px;border-radius:20px;}

.stats{display:flex;background:var(--card);border-radius:16px;padding:14px 6px;box-shadow:0 2px 10px rgba(20,40,90,.06);margin-bottom:16px;}
.stat{flex:1;text-align:center;padding:0 4px;border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat .num{font-size:20px;font-weight:800;}
.stat .lbl{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.3;}

.actionbtn{
  display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:16px;
  padding:16px 16px;margin-bottom:12px;color:#fff;cursor:pointer;text-align:left;
  box-shadow:0 4px 12px rgba(20,40,90,.12);
}
.actionbtn .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.actionbtn .tx{flex:1;}
.actionbtn .tx .h{font-weight:800;font-size:15px;}
.actionbtn .tx .s{font-size:12px;opacity:.92;margin-top:2px;}
.actionbtn .chev{font-size:20px;opacity:.85;}
.actionbtn:active{filter:brightness(.95);}
.bg-blue{background:linear-gradient(135deg,#2563eb,#1447bd);}
.bg-green{background:linear-gradient(135deg,#22c55e,#0e8f42);}
.bg-red{background:linear-gradient(135deg,#ef4444,#b91c1c);}
.bg-orange{background:linear-gradient(135deg,#f59e0b,#c2650f);}
.bg-purple{background:linear-gradient(135deg,#a855f7,#6d28d9);}

.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,40,90,.06);margin-bottom:14px;}
.card h3{margin:0 0 10px;font-size:15px;color:var(--blue-900);}
.muted{color:var(--sub);font-size:12.5px;line-height:1.5;}

.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;}
.btn-primary{background:var(--blue-600);color:#fff;}
.btn-primary:active{background:var(--blue-700);}
.btn-outline{background:#fff;color:var(--blue-600);border:1.5px solid var(--blue-600);}
.btn-ghost{background:var(--blue-50);color:var(--blue-700);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;}
.btn-danger{background:#fff;color:var(--red);border:1.5px solid #f3c7c7;}
.row-gap{display:flex;gap:10px;}
.row-gap>*{flex:1;}

.backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.backrow button{background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;color:var(--blue-700);}
.backrow .t{font-weight:800;font-size:16px;color:var(--blue-900);}

.dropzone{
  border:2px dashed #b9c9f0;border-radius:16px;background:#f6f9ff;padding:26px 14px;text-align:center;cursor:pointer;
}
.dropzone .ic{font-size:30px;}
.dropzone .t{font-weight:700;margin-top:8px;font-size:14px;color:var(--blue-900);}
.dropzone .s{font-size:12px;color:var(--sub);margin-top:3px;}

.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;}

.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #d9e4fb;border-top-color:var(--blue-600);animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.proc-wrap{text-align:center;padding:50px 10px;}
.proc-wrap .msg{margin-top:16px;font-weight:700;color:var(--blue-900);}
.proc-wrap .sub{margin-top:6px;font-size:12.5px;color:var(--sub);}

.pagepick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.pagepick button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;}
.pagepick button.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;}
table.cc{border-collapse:collapse;font-size:11.5px;min-width:100%;}
table.cc th,table.cc td{border:1px solid var(--line);padding:4px;text-align:center;white-space:nowrap;}
table.cc th{background:var(--blue-50);color:var(--blue-900);font-size:10.5px;position:sticky;top:0;}
table.cc td.name{text-align:left;font-weight:600;min-width:120px;position:sticky;left:0;background:#fff;z-index:2;}
table.cc th.name-h{position:sticky;left:0;z-index:3;min-width:120px;text-align:left;}
table.cc td.msnv{min-width:56px;color:var(--sub);}
table.cc input.cell{width:34px;border:none;background:transparent;text-align:center;font-size:11px;padding:3px 0;font-family:inherit;}
table.cc input.cell:focus{background:#fff8dc;outline:1px solid var(--blue-400,#93b7ff);border-radius:4px;}
table.cc td.tot{font-weight:800;color:var(--blue-700);background:#f6f9ff;}
table.cc td.tot2{font-weight:800;color:var(--orange-d);background:#fff7ec;}
table.cc input.txt{border:none;background:transparent;font-size:11.5px;width:90px;font-family:inherit;}
table.cc input.small{width:44px;}

.legend-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.legend-row input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit;}
.legend-row input.sym{width:52px;text-align:center;font-weight:700;}
.legend-row input.lbl{flex:1;}
.legend-row input.val{width:56px;text-align:center;}
.legend-row button.del{border:none;background:#fdeaea;color:var(--red);width:30px;height:30px;border-radius:8px;cursor:pointer;}

.fab-export{position:sticky;bottom:10px;margin-top:14px;}

.hist-item{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(20,40,90,.06);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.hist-item .l{font-weight:700;font-size:14px;color:var(--blue-900);}
.hist-item .r{font-size:11.5px;color:var(--sub);margin-top:3px;}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#152447;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center;}

.empty{text-align:center;padding:40px 20px;color:var(--sub);}
.empty .ic{font-size:34px;}
label.field-lbl{font-size:12.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}
select.sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:13px;}
input.txtfield{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:13px;}
.footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
